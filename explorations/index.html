<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Melero Realty — Explorador de direcciones</title>
    <style>
      :root {
        --green: #122f35;
        --gold: #6fb3c9;
        --bar: #0d3646;
        --line: rgba(255, 255, 255, 0.14);
        --dim: rgba(255, 255, 255, 0.5);
        --bar-h: 52px;
        --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo,
          Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--green);
        color: #fff;
        font-family: var(--mono);
        overflow: hidden;
      }

      /* ---------- barra ---------- */
      header {
        height: var(--bar-h);
        display: flex;
        align-items: stretch;
        background: var(--bar);
        border-bottom: 1px solid var(--line);
        position: relative;
        z-index: 10;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0 1.1rem;
        border-right: 1px solid var(--line);
        white-space: nowrap;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
      }
      .brand b {
        font-weight: 700;
      }
      .brand span {
        color: var(--dim);
        font-weight: 400;
      }
      nav {
        display: flex;
        align-items: stretch;
        overflow-x: auto;
        scrollbar-width: thin;
        flex: 1;
      }
      nav button {
        appearance: none;
        background: none;
        border: 0;
        border-right: 1px solid var(--line);
        border-top: 2px solid transparent;
        color: #fff;
        font: inherit;
        padding: 0 1.05rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.18rem;
        cursor: pointer;
        white-space: nowrap;
        text-align: left;
        transition: background 0.15s ease;
      }
      nav button:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      nav button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: -2px;
      }
      nav button .k {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      nav button .t {
        font-size: 0.5625rem;
        letter-spacing: 0.13em;
        color: var(--dim);
        text-transform: uppercase;
      }
      nav button[aria-current='true'] {
        border-top-color: var(--gold);
        background: rgba(255, 255, 255, 0.06);
      }
      nav button[aria-current='true'] .k {
        color: var(--gold);
      }
      nav button[data-pending='true'] {
        opacity: 0.38;
      }
      nav button[data-pending='true'] .t::after {
        content: ' · generando';
        color: var(--gold);
      }
      .hint {
        display: flex;
        align-items: center;
        padding: 0 1.1rem;
        border-left: 1px solid var(--line);
        font-size: 0.625rem;
        letter-spacing: 0.12em;
        color: var(--dim);
        white-space: nowrap;
      }

      /* ---------- escenario ---------- */
      main {
        height: calc(100% - var(--bar-h));
        position: relative;
        background: #0a2b38;
      }
      iframe {
        border: 0;
        display: block;
        background: #fff;
      }
      #single {
        width: 100%;
        height: 100%;
      }
      #single.phone {
        width: 390px;
        height: 100%;
        margin: 0 auto;
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }

      #grid {
        display: none;
        height: 100%;
        overflow-y: auto;
        padding: 1.25rem;
        gap: 1.25rem;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        align-content: start;
      }
      body[data-view='grid'] #grid {
        display: grid;
      }
      body[data-view='grid'] #single {
        display: none;
      }
      .cell {
        border: 1px solid var(--line);
        background: #fff;
        position: relative;
        overflow: hidden;
        height: 62vh;
      }
      .cell figcaption {
        position: absolute;
        inset: auto 0 0 0;
        background: var(--bar);
        border-top: 1px solid var(--line);
        color: #fff;
        font-size: 0.625rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 0.55rem 0.8rem;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        z-index: 2;
      }
      .cell figcaption b {
        color: var(--gold);
        font-weight: 700;
      }
      .cell .scaler {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .cell iframe {
        width: 1440px;
        height: 2400px;
        transform-origin: 0 0;
      }
      .cell a.open {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .cell.pending {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bar);
        color: var(--dim);
        font-size: 0.6875rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .pending-note {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bar);
        color: var(--dim);
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        text-align: center;
        padding: 2rem;
      }
    </style>
  </head>
  <body data-view="single">
    <header>
      <div class="brand"><b>MELERO</b><span>DIRECCIONES</span></div>
      <nav id="nav" aria-label="Variantes"></nav>
      <div class="hint">1–9 · G REJILLA · M MÓVIL</div>
    </header>

    <main>
      <iframe id="single" title="Variante" src="about:blank"></iframe>
      <div id="grid"></div>
    </main>

    <script>
      // Registro de variantes. Añadir sub-variantes (v2a, v2b…) aquí
      // conforme se vayan generando: el explorador se reconstruye solo.
      const VARIANTS = [
        {
          id: 'v4a',
          file: 'v4a-fiel.html',
          label: 'V4A',
          tag: 'Fiel · tarjeta',
        },
        {
          id: 'v4b',
          file: 'v4b-claro.html',
          label: 'V4B',
          tag: 'Claro · hero partido',
        },
        {
          id: 'v4c',
          file: 'v4c-sangre.html',
          label: 'V4C',
          tag: 'A sangre · editorial',
        },
        {
          id: 'v4',
          file: 'v4-contraste.html',
          label: 'V4',
          tag: 'Original · referencia',
        },
      ];

      const nav = document.getElementById('nav');
      const single = document.getElementById('single');
      const grid = document.getElementById('grid');
      const ready = new Set();

      function currentId() {
        const h = location.hash.replace('#', '');
        if (h === 'grid') return 'grid';
        return VARIANTS.some((v) => v.id === h) ? h : VARIANTS[0].id;
      }

      function renderNav() {
        nav.innerHTML = '';
        VARIANTS.forEach((v, i) => {
          const b = document.createElement('button');
          b.innerHTML = `<span class="k">${v.label}</span><span class="t">${v.tag}</span>`;
          b.dataset.pending = String(!ready.has(v.id));
          b.setAttribute('aria-current', String(currentId() === v.id));
          b.onclick = () => (location.hash = v.id);
          if (i < 9) b.title = `Tecla ${i + 1}`;
          nav.appendChild(b);
        });
        const g = document.createElement('button');
        g.innerHTML = `<span class="k">TODAS</span><span class="t">Rejilla</span>`;
        g.setAttribute('aria-current', String(currentId() === 'grid'));
        g.onclick = () => (location.hash = 'grid');
        nav.appendChild(g);
      }

      function renderGrid() {
        grid.innerHTML = '';
        VARIANTS.forEach((v) => {
          const fig = document.createElement('figure');
          fig.className = 'cell';
          fig.style.margin = '0';
          if (!ready.has(v.id)) {
            fig.innerHTML = `<div class="pending-note">${v.label} · generando…</div>
              <figcaption><span>${v.tag}</span><b>${v.label}</b></figcaption>`;
            grid.appendChild(fig);
            return;
          }
          fig.innerHTML = `
            <div class="scaler"><iframe src="${v.file}" title="${v.tag}" scrolling="no" tabindex="-1"></iframe></div>
            <a class="open" href="#${v.id}" aria-label="Abrir ${v.tag} a tamaño completo"></a>
            <figcaption><span>${v.tag}</span><b>${v.label}</b></figcaption>`;
          grid.appendChild(fig);
          const frame = fig.querySelector('iframe');
          const fit = () => {
            const s = fig.clientWidth / 1440;
            frame.style.transform = `scale(${s})`;
          };
          fit();
          new ResizeObserver(fit).observe(fig);
        });
      }

      function route() {
        const id = currentId();
        document.body.dataset.view = id === 'grid' ? 'grid' : 'single';
        if (id === 'grid') {
          renderGrid();
        } else {
          const v = VARIANTS.find((x) => x.id === id);
          const next = ready.has(id) ? v.file : 'about:blank';
          if (single.getAttribute('src') !== next) single.src = next;
        }
        renderNav();
      }

      // Sondeo ligero: marca como listas las variantes ya escritas en disco.
      async function probe() {
        let changed = false;
        await Promise.all(
          VARIANTS.filter((v) => !ready.has(v.id)).map(async (v) => {
            try {
              const r = await fetch(v.file, { method: 'HEAD', cache: 'no-store' });
              if (r.ok) {
                ready.add(v.id);
                changed = true;
              }
            } catch {}
          }),
        );
        if (changed) route();
        if (ready.size < VARIANTS.length) setTimeout(probe, 4000);
      }

      addEventListener('hashchange', route);
      addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const tag = document.activeElement?.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        const n = Number(e.key);
        if (n >= 1 && n <= VARIANTS.length) location.hash = VARIANTS[n - 1].id;
        else if (e.key.toLowerCase() === 'g') location.hash = 'grid';
        else if (e.key.toLowerCase() === 'm') single.classList.toggle('phone');
      });

      route();
      probe();
    </script>
  </body>
</html>
